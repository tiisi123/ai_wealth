# W1 单实例启动：docker compose up -d db && npm run migrate && npm run seed && npm start
# 使用 .env 中 DATA_MODE=database / AI_MODE=fixture 的配置；双节点 app_a/app_b
# 属于 W2 预发布流水线，生产必须设 AI_MODE=real 并提供真实模型配置。
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: wealth_demo
      POSTGRES_USER: wealth
      POSTGRES_PASSWORD: wealth
    volumes:
      - wealth-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealth -d wealth_demo"]
      interval: 5s
      timeout: 3s
      retries: 20

  app_a:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      INSTANCE_ID: app-a
      DATABASE_URL: postgres://wealth:wealth@db:5432/wealth_demo
      DATABASE_SSL: "false"
      DOCUMENT_STORE_PATH: /shared-documents
      DATA_MODE: database
      AI_MODE: ${AI_MODE:-real}
      REQUIRE_MODEL: "true"
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-}
      MODEL_TIMEOUT_MS: ${MODEL_TIMEOUT_MS:-30000}
      KNOWLEDGE_VECTOR_DIM: ${KNOWLEDGE_VECTOR_DIM:-1536}
    volumes:
      - wealth-documents:/shared-documents
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "node scripts/migrate.js && node scripts/seed.js && node src/server.js"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ready >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  app_b:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      INSTANCE_ID: app-b
      DATABASE_URL: postgres://wealth:wealth@db:5432/wealth_demo
      DATABASE_SSL: "false"
      DOCUMENT_STORE_PATH: /shared-documents
      DATA_MODE: database
      AI_MODE: ${AI_MODE:-real}
      REQUIRE_MODEL: "true"
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-}
      MODEL_TIMEOUT_MS: ${MODEL_TIMEOUT_MS:-30000}
      KNOWLEDGE_VECTOR_DIM: ${KNOWLEDGE_VECTOR_DIM:-1536}
    volumes:
      - wealth-documents:/shared-documents
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "node scripts/migrate.js && node scripts/seed.js && node src/server.js"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ready >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  load_balancer:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app_a:
        condition: service_healthy
      app_b:
        condition: service_healthy

volumes:
  wealth-db:
  wealth-documents:
